<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Cover Studio</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="appRoot" class="app-root">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">VC</span>
      <div>
        <h1>Vice Cover Studio</h1>
        <p>Your photos. Poster panels. One bold cover.</p>
      </div>
    </div>
    <div class="top-actions">
      <label class="size-label">Export size
        <select id="sizeSelect">
          <option value="1080x1080">1080 x 1080 — Square</option>
          <option value="1080x1350">1080 x 1350 — Portrait</option>
          <option value="1920x1080">1920 x 1080 — Wide</option>
        </select>
      </label>
      <button id="exportBtn" class="export-btn" type="button">Export PNG</button>
    </div>
  </header>

  <main class="workspace">
    <section class="preview-pane">
      <div class="canvas-wrap">
        <canvas id="previewCanvas" width="1080" height="1080"></canvas>
      </div>
      <p class="hint">Click a panel in the preview to select it, then use the sliders to crop and position its photo.</p>
      <div id="panelTabs" class="panel-tabs"></div>
    </section>

    <aside class="controls">
      <div class="control-group">
        <h2>Photo</h2>
        <label class="file-label">Load your photo
          <input id="photoInput" type="file" accept="image/*">
        </label>
        <div class="sample-row">
          <span>Try a sample:</span>
          <button type="button" class="sample-btn" data-sample="boulevard">Boulevard</button>
          <button type="button" class="sample-btn" data-sample="pier">Pier</button>
          <button type="button" class="sample-btn" data-sample="harbor">Harbor</button>
        </div>
        <button id="fillAllBtn" type="button" class="secondary-btn">Fill all panels with current photo</button>
      </div>

      <div class="control-group">
        <h2>Layout &amp; grade</h2>
        <label>Layout
          <select id="layoutSelect">
            <option value="classic">Classic — big panel + two small</option>
            <option value="duo">Duo — two tall panels</option>
            <option value="grid">Grid — 2 x 2 panels</option>
          </select>
        </label>
        <label>Colour grade
          <select id="gradeSelect">
            <option value="sunset">Sunset</option>
            <option value="neon">Neon</option>
            <option value="gold">Golden hour</option>
          </select>
        </label>
      </div>

      <div class="control-group">
        <h2>Caption</h2>
        <label>Caption text
          <input id="captionInput" type="text" value="Vice Heat" maxlength="28" placeholder="Type your caption">
        </label>
      </div>

      <div class="control-group">
        <h2>Selected panel crop</h2>
        <label>Scale <span id="scaleVal">1.00</span>
          <input id="scaleSlider" type="range" min="1" max="3" step="0.01" value="1">
        </label>
        <label>Move left / right <span id="offsetXVal">0</span>
          <input id="offsetXSlider" type="range" min="-100" max="100" step="1" value="0">
        </label>
        <label>Move up / down <span id="offsetYVal">0</span>
          <input id="offsetYSlider" type="range" min="-100" max="100" step="1" value="0">
        </label>
      </div>
    </aside>
  </main>
</div>
<div id="shotStage" class="shot-stage" hidden>
  <canvas id="shotCanvas"></canvas>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
